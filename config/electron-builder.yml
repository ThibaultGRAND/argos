# Packaging d'Argos (PLAN.md §3.3). Pas de signature payante : voir PLAN.md §3.1.
appId: com.thibaultgrand.argos
productName: Argos
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  # Le binaire Claude fourni par l'Agent SDK (≈ 230 Mo) n'est pas embarqué : Argos utilise la CLI installée (F05).
  - '!node_modules/@anthropic-ai/claude-agent-sdk-*/**'
# Icônes générées à partir de brand/argos-icone-app.svg (icon.png : pleine page ; icon-mac.png : grille Apple 824/1024).
icon: build/icon.png
extraResources:
  - from: build/icon.png
    to: icon.png
  - from: src/infrastructure/database/argos/migrations
    to: migrations/argos
  - from: src/infrastructure/database/index/migrations
    to: migrations/index
asar: true
npmRebuild: true
# Publication sur GitHub Releases, en brouillon : Thibault relit puis publie (features/distribution.md).
# Génère aussi les fichiers lus par electron-updater (latest*.yml, app-update.yml).
publish:
  provider: github
  owner: ThibaultGRAND
  repo: argos
  releaseType: draft
mac:
  icon: build/icon-mac.png
  # Apple Silicon et Intel. Pas de zip : sans signature, pas d'installation automatique sur macOS.
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  identity: null
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Development
  maintainer: Thibault Grand
