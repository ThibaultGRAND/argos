name: Idea / feature request
description: Suggest an idea or a feature / Proposer une idée ou une fonctionnalité
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Check the roadmap in [PLAN.md](https://github.com/ThibaultGRAND/argos/blob/main/PLAN.md) first: your idea may already be planned.
        You can write in English or French.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should Argos do? Describe what you would see and do.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: This idea needs no server, no paid service, and works on macOS, Windows and Linux.
          required: true
