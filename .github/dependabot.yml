# Mises à jour des dépendances (gratuit sur un dépôt public).
# Les correctifs de sécurité sont proposés à part, dès qu'une alerte est publiée.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Les versions majeures changent la stack : décidées par Thibault, jamais automatiques (CLAUDE.md §3.3).
    # Les correctifs de sécurité arrivent quand même, y compris pour une version majeure.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      # Une seule PR par semaine pour les mises à jour mineures et correctives.
      npm-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
