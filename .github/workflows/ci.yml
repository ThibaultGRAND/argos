name: CI

on:
  push:
    branches: [main]
  pull_request:

# Jeton en lecture seule : une pull request venant d'un fork ne peut rien modifier dans le dépôt.
permissions:
  contents: read

jobs:
  verify:
    name: Vérification (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run build
